name: Image

# Publishes the self-hosting image (docker-compose.yml, docs/self-hosting.md)
# to GitHub Container Registry for linux/amd64 and linux/arm64:
#   a tag vX.Y.Z  ->  :X.Y.Z, :X.Y and :latest
#   a push to main ->  :edge (and :sha-<short>)
# The same Dockerfile the hosted server uses (deploy/Dockerfile).

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jatin-roopchandani/lore

jobs:
  publish:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # arm64 runs under QEMU on this x86 runner; the web UI stage builds on the
      # runner's own platform (deploy/Dockerfile), so only Python runs emulated.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=LORE
            org.opencontainers.image.description=An AI ebook reader: ask your books anything, every answer checked against the page. Self-hosted.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/Jatin-Roopchandani/LORE/blob/main/docs/self-hosting.md
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          provenance: false
