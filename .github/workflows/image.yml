name: Image

# Publishes the self-hosting image (docker-compose.yml, docs/self-hosting.md)
# to GitHub Container Registry for linux/amd64 and linux/arm64:
#   a tag vX.Y.Z  ->  :X.Y.Z, :X.Y and :latest
#   a push to main ->  :edge (and :sha-<short>)
# The same Dockerfile the hosted server uses (deploy/Dockerfile).
# Every action is pinned to a commit SHA (this job can push the image every
# self-hoster pulls); Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; the publish job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/jatin-roopchandani/lore

jobs:
  publish:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # arm64 runs under QEMU on this x86 runner; the web UI stage builds on the
      # runner's own platform (deploy/Dockerfile), so only Python runs emulated.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=LORE
            org.opencontainers.image.description=An AI ebook reader: ask your books anything, every answer checked against the page. Self-hosted.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/Jatin-Roopchandani/LORE/blob/main/docs/self-hosting.md
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          provenance: false
