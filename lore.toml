# LORE configuration — see lore/config.py for all keys and defaults.
[lore]
data_dir = "data"
# "kaggle" (free T4 burst, default) | "ollama" (fully local, zero-egress)
extraction_provider = "kaggle"

[lore.ollama]
host = "http://localhost:11434"
model = "qwen2.5:3b-instruct-q4_K_M"

[lore.kaggle]
username = "jatinroopchandani"  # personal Kaggle username (required for doctor --kaggle)
kernel_slug = "lore-hello"
dataset_slug = "lore-hello-data"
poll_interval_s = 30
poll_timeout_s = 5400   # size-40 units run ~1505s typical; 1800s timed out a dense one
extract_kernel_slug = "lore-extract"
extract_dataset_slug = "lore-extract-data"

[lore.extraction]
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
embed_model = "nomic-ai/nomic-embed-text-v1.5"
embed_model_ollama = "nomic-embed-text"
work_unit_size = 40          # safe since bfe61bf decoupled vLLM concurrency from unit size
vllm_version = ""            # empty installs the latest vLLM on the kernel

# `lore ask`'s two LLM steps. Code defaults are "ollama" for both, so a
# checkout with no key still works; this project uses Gemini for both, for
# quality (Phase 3 Tasks 7c and 8b). "gemini" sends the question, its seed
# entity names and its evidence passages to Google. The key comes from
# GEMINI_API_KEY or ~/.config/lore/gemini.env (mode 600), never from here.
[lore.selection]
provider = "gemini"

[lore.synthesis]
provider = "gemini"
