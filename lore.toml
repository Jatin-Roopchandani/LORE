# LORE configuration — see lore/config.py for all keys and defaults.
[lore]
data_dir = "data"
# "kaggle" (free T4 burst, default) | "ollama" (fully local, zero-egress)
extraction_provider = "kaggle"

[lore.ollama]
host = "http://localhost:11434"
model = "qwen2.5:3b-instruct-q4_K_M"

[lore.kaggle]
username = "jatinroopchandani"  # personal Kaggle username (required for doctor --kaggle)
kernel_slug = "lore-hello"
dataset_slug = "lore-hello-data"
poll_interval_s = 30
poll_timeout_s = 1800
extract_kernel_slug = "lore-extract"
extract_dataset_slug = "lore-extract-data"

[lore.extraction]
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
embed_model = "nomic-ai/nomic-embed-text-v1.5"
embed_model_ollama = "nomic-embed-text"
work_unit_size = 10          # 10 verified on a Kaggle T4; 40 crashes vLLM's engine
vllm_version = ""            # empty installs the latest vLLM on the kernel
