[project]
name = "lore"
version = "0.2.0"
license = { text = "MIT" }
description = "LORE - Local Orchestration & Relational Extraction: a local-first literary knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "kuzu>=0.6",
    "lancedb>=0.13",
    "pyarrow>=17.0",
    "typer>=0.12",
    "pysbd>=0.3.4",
    "ebooklib>=0.20",
    "pymupdf>=1.28.2",
    "mcp>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.7",
    "authlib>=1.9.3",
    "itsdangerous>=2.2.0",
    "cryptography>=46",
    "anthropic>=2.6.0",
    "openai>=3.46.0",
    "argon2-cffi>=23.1",
]

[project.scripts]
lore = "lore.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lore"]
artifacts = ["lore/web/static/**"]

[tool.pytest.ini_options]
markers = [
    "live: tests that hit real local services (ollama); deselect with -m 'not live'",
    "network: tests allowed to reach non-local hosts (opts out of the socket guard)",
    "postgres: runs migrations against a throwaway postgres container; needs docker and LORE_TEST_POSTGRES=1",
    "factual_default: run with the shipped write.PROSE_FACTUAL default (conftest pins it on otherwise)",
]
asyncio_mode = "auto"
